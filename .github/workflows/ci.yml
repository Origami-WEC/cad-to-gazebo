name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable) with dev and freecad extras
        # `freecad` pulls only the pure-Python mesh helper (trimesh) used by the
        # export/demo path, so the demo generator can be exercised end to end
        # through the IR validator here instead of skipping. FreeCAD itself is
        # still not installed and is still not imported by any test.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,freecad]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate the shipped IR fixtures (fail-fast validator)
        # The IR contract gate: the validator is exercised here exactly the way
        # the export path calls it. A non-zero exit fails the job.
        run: |
          python -m cad.ir_schema --print-schema > /dev/null
          python -m cad.ir_schema tests/fixtures/cad_manifest_demo.json \
                                  tests/fixtures/cad_manifest_full.json \
                                  tests/fixtures/cad_manifest_sample_assembly.json \
                                  tests/fixtures/cad_manifest_urdf_skeleton.json

      - name: Reproducible artefact (C4) - regenerate and diff
        # The SDF-ready artefact is a committed deliverable: regenerate it from
        # the committed IR + meshes and require byte identity, so neither the
        # generator nor the file itself can drift unnoticed. `scipy` (qhull)
        # arrives with the `freecad` extra, so the hull rung is covered here.
        run: |
          python tests/fixtures/make_sample_meshes.py --out tests/fixtures
          python -m cad.sdf_artifacts \
              --manifest tests/fixtures/cad_manifest_sample_assembly.json \
              --ws       tests/fixtures \
              --out      tests/fixtures/sdf_artifacts_sample.json \
              --write-collision
          git diff --exit-code -- tests/fixtures/sdf_artifacts_sample.json \
                                    tests/fixtures/meshes

      - name: Kinematic URDF skeleton (C6) - regenerate and diff
        # Same rule as C4: the skeleton is a committed deliverable and the CI
        # gate is a byte-identity check against the committed golden file.
        # `--strict` also rejects a multi-root tree, i.e. the artefact that
        # robot_state_publisher would refuse to load.
        run: |
          python -m cad.urdf_skeleton \
              --manifest tests/fixtures/cad_manifest_urdf_skeleton.json \
              --out      tests/fixtures/urdf_skeleton_sample.urdf \
              --strict
          git diff --exit-code -- tests/fixtures/urdf_skeleton_sample.urdf

      - name: Test (pytest)
        # No FreeCAD and no maritime_ws workspace in CI: the suite covers the
        # pure-Python units only and must stay green without either of them.
        # A failing test returns a non-zero exit and fails this job — the gate.
        run: python -m pytest

  step-headless:
    # The STEP front-end (`cad.step_import`) needs the OCCT kernel. It is an
    # optional extra, so it gets its own job instead of being forced on every
    # Python version: a skip in the job above means "not verified here", never
    # "verified green", and this job is what actually proves the import works.
    # Prebuilt cadquery-ocp wheels exist for linux x86_64 and aarch64.
    name: step import (OCCT kernel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package (editable) with the step and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,step]"

      - name: STEP headless import (pytest)
        # Runs with the kernel present, so the AP242 fixture is really imported,
        # the malformed-file path is really exercised, and the tests fail (not
        # skip) if the kernel is there but broken. The real 36 MB FreeCAD export
        # is not in this repository: that single test skips with an explicit
        # reason unless CAD_TO_GAZEBO_STEP_FIXTURE points at a checkout.
        # Both kernel suites run here, not just the import front-end: the
        # bridge's kernel half (`step_to_ir`) only proves itself with OCCT
        # present -- the contract's LCS/anchors/sensors and the resolved
        # non-native joints reach the validated IR only in this job.
        run: python -m pytest tests/test_step_import_ocp.py tests/test_step_to_ir_ocp.py -v
