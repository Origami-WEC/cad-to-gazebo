name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable) with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # No FreeCAD and no maritime_ws workspace in CI: the suite covers the
        # pure-Python units only and must stay green without either of them.
        # A failing test returns a non-zero exit and fails this job — the gate.
        run: python -m pytest

  step-headless:
    # The STEP front-end (`cad.step_import`) needs the OCCT kernel. It is an
    # optional extra, so it gets its own job instead of being forced on every
    # Python version: a skip in the job above means "not verified here", never
    # "verified green", and this job is what actually proves the import works.
    # Prebuilt cadquery-ocp wheels exist for linux x86_64 and aarch64.
    name: step import (OCCT kernel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package (editable) with the step and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,step]"

      - name: STEP headless import (pytest)
        # Runs with the kernel present, so the AP242 fixture is really imported,
        # the malformed-file path is really exercised, and the tests fail (not
        # skip) if the kernel is there but broken. The real 36 MB FreeCAD export
        # is not in this repository: that single test skips with an explicit
        # reason unless CAD_TO_GAZEBO_STEP_FIXTURE points at a checkout.
        run: python -m pytest tests/test_step_import_ocp.py -v
